name: Construire et publier l'application Android

# À chaque envoi de code (ou en cliquant « Run workflow ») :
#   1. recopie le site dans l'application
#   2. construit le fichier NiaChat.apk
#   3. le publie au lien permanent (release android-latest)
# Le numéro de version monte tout seul : 101, 102, 103…
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  android:
    name: APK Android NiaChat
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le kit Android
        uses: android-actions/setup-android@v3

      - name: Calculer le numéro de version
        id: version
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./mobile/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Embarquer le site dans l'application
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap sync android

      - name: Inscrire la version
        run: |
          F=mobile/android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.code }}/" "$F"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.version.outputs.name }}\"/" "$F"
          grep -nE "versionCode|versionName" "$F" | head -3

      - name: Vérifier si la clé de signature est là
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Poser la clé de signature
        if: ${{ steps.sign.outputs.ok == 'true' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS" | base64 -d > mobile/android/release.keystore

      - name: Construire l'APK de test
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Construire l'APK signé
        if: ${{ steps.sign.outputs.ok == 'true' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Préparer le fichier
        run: |
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk NiaChat.apk
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk NiaChat.apk
          fi
          ls -l NiaChat.apk

      - name: Publier au lien permanent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-latest --title "NiaChat Android - derniere version" --notes "Remplacee automatiquement a chaque mise a jour." || true
          gh release upload android-latest NiaChat.apk --clobber

      - name: Garder une copie dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: NiaChat-Android-${{ steps.version.outputs.name }}-code${{ steps.version.outputs.code }}
          path: NiaChat.apk
